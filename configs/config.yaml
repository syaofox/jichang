# ==============================================================================
# mihomo 配置（OpenWrt / nikki）
#
# 以网上 qcy 的「防泄露专业版 mihomo.yaml」为基础，合并本仓库原有配置：
#   - 保留 Dfox / Bunny 两个订阅（本地订阅服务，直连下载，自动加节点前缀）
#   - 保留自建业务分组与自建规则集
#     （漫画柜 / JavDB / 禁漫天堂 / DMM / PickPak / OpenCode，来自 rule-providers/）
#   - 保留 external-ui、端口等环境相关设置
#
# 相比原配置的主要变化：
#   - DNS 换成网上的防泄露方案：fake-ip + 分域名策略解析
#     （大陆域名走国内 DoH，境外域名走代理 DoH，避免 DNS 泄露）
#   - 规则集换成「自建 classical 列表 + MetaCubeX mrs 规则集」组合
#   - 新增 Steam / Wallet 分组，取消 GEOSITE + geodata 依赖
#
# 注意事项：
#   - 默认拦截「境外域名 + UDP 443(QUIC)」，让不支持 UDP 的机场回退 TCP；
#     如果你的机场支持 UDP，可以删掉最前面那条 AND 规则。
#   - 已按原作者说明处理 Google Play 无法更新：googleapis.cn 与
#     xn--ngstr-lra8j.com 走国外 DNS 并代理。
# ==============================================================================

rule-anchor:
  # 订阅模板：直连下载，并过滤掉「剩余流量 / 到期时间」等非节点条目
  P: &P
    type: http
    interval: 86400
    proxy: 直连
    exclude-filter: "官网|剩余|流量|套餐|订阅|直连|到期时间|GB|Expire Date|Traffic|ExpireDate"
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300

  # 规则集模板
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  domain_text: &domain_text {type: http, interval: 86400, behavior: domain, format: text}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

  # 分组节点过滤：排除机场的流量/到期等非节点条目，也不把直连放进代理组
  filter: &filter_rule "^((?!(官网|剩余|流量|套餐|订阅|到期时间|直连|DIRECT|GB|Expire Date|Traffic|ExpireDate)).)*$"

proxy-providers:
  Dfox:
    <<: *P
    url: "http://10.10.10.6:9000/download/Doutlook"
    override:
      additional-prefix: "[Dfox]"

  Bunny:
    <<: *P
    url: "http://10.10.10.6:9000/download/bunny"
    override:
      additional-prefix: "[Bunny]"

proxies:
  - {name: 直连, type: direct, udp: true}

mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-name: metacubexd
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

# geodata：DNS 的 fallback-filter geoip 判断需要 mmdb
# （已不再使用 geosite/geoip.dat，也不需要 asn）
geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

ntp:
  enable: true
  write-to-system: true

tun:
  enable: true
  stack: mixed   # 内核版本 > v1.19.31 可换成自研协议栈 mips
  device: mihomo0
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  # 大陆 IP 不进 tun，由系统直接路由
  route-exclude-address-set:
    - cn_ip

sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    # Google 商店相关域名：写在前面的域名条目优先于下面的 rule-set 条目，强制走国外 DNS
    "+.googleapis.cn":
      - "https://8.8.8.8/dns-query#默认代理&disable-qtype-65=true"
    "+.xn--ngstr-lra8j.com":
      - "https://8.8.8.8/dns-query#默认代理&disable-qtype-65=true"
    # 大陆 / 私有域名：国内 DNS
    "rule-set:cn_domain,private_domain,fakeipfilter_cn,steamcn_domain,microsoftcn_domain,applecn_domain":
      - "https://dns.alidns.com/dns-query#disable-qtype-65=true"
      - "https://doh.pub/dns-query#disable-qtype-65=true"
    # 需要真实解析的境外域名（fake-ip 过滤列表）
    "rule-set:fakeipfilter_!cn":
      - "https://8.8.8.8/dns-query#默认代理&disable-qtype-65=true"
  nameserver:
    - "https://8.8.8.8/dns-query#默认代理&ecs=223.5.5.0/24"
  fallback:
    - "https://8.8.8.8/dns-query#默认代理"
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "169.254.169.254"
    - "+.market.xiaomi.com"
    - "+.miui.com"
    - "+.xiaomi.com"
    - "connectivity-check.gstatic.com"
    - "msftconnecttest.com"
    - "msftncsi.com"
    - "rule-set:fakeipfilter_cn"
    - "rule-set:fakeipfilter_!cn"
    - "rule-set:private_domain"
    - "rule-set:cn_domain"
    - "rule-set:microsoftcn_domain"
    - "rule-set:applecn_domain"
    - "rule-set:steamcn_domain"

proxy-groups:
  # 默认代理：不含直连，机场不可用时直接失败，避免静默直连导致超时
  - {name: 默认代理, type: select, include-all: true, filter: *filter_rule}
  - {name: 国内直连, type: select, proxies: [直连, 默认代理]}

  # 自建业务分组
  - {name: 漫画柜, type: select, proxies: [默认代理, 直连], include-all: true, filter: *filter_rule}
  - {name: JavDB, type: select, proxies: [默认代理, 直连], include-all: true, filter: *filter_rule}
  - {name: 禁漫天堂, type: select, proxies: [默认代理, 直连], include-all: true, filter: *filter_rule}
  - {name: DMM, type: select, proxies: [默认代理, 直连], include-all: true, filter: *filter_rule}
  - {name: PickPak, type: select, proxies: [默认代理, 直连], include-all: true, filter: *filter_rule}
  - {name: OpenCode, type: select, proxies: [默认代理, 直连], include-all: true, filter: *filter_rule}

  # 通用分流分组
  - {name: YouTube, type: select, proxies: [默认代理, 直连], include-all: true, filter: *filter_rule}
  - {name: Google, type: select, proxies: [默认代理, 直连], include-all: true, filter: *filter_rule}
  - {name: AI, type: select, proxies: [默认代理, 直连], include-all: true, filter: *filter_rule}
  - {name: GitHub, type: select, proxies: [默认代理, 直连], include-all: true, filter: *filter_rule}
  - {name: OneDrive, type: select, proxies: [直连, 默认代理], include-all: true, filter: *filter_rule}
  - {name: Microsoft, type: select, proxies: [直连, 默认代理], include-all: true, filter: *filter_rule}
  - {name: Apple, type: select, proxies: [直连, 默认代理], include-all: true, filter: *filter_rule}
  - {name: TikTok, type: select, proxies: [默认代理, 直连], include-all: true, filter: *filter_rule}
  - {name: Telegram, type: select, proxies: [默认代理, 直连], include-all: true, filter: *filter_rule}
  - {name: NETFLIX, type: select, proxies: [默认代理, 直连], include-all: true, filter: *filter_rule}
  - {name: Steam, type: select, proxies: [直连, 默认代理], include-all: true, filter: *filter_rule}
  - {name: PayPal, type: select, proxies: [默认代理, 直连], include-all: true, filter: *filter_rule}
  - {name: Wallet, type: select, proxies: [默认代理, 直连], include-all: true, filter: *filter_rule}

rules:
  # 境外域名拒绝 QUIC（UDP 443），避免机场不支持 UDP 时流量黑洞，让客户端回退 TCP
  - AND,((RULE-SET,cn!_domain),(DST-PORT,443),(NETWORK,UDP)),REJECT
  - AND,((NETWORK,UDP),(DST-PORT,123)),国内直连
  - IP-CIDR,169.254.169.254/32,REJECT,no-resolve
  - RULE-SET,private_ip,国内直连,no-resolve
  - RULE-SET,private_domain,国内直连

  # 自建业务分流（优先匹配）
  - RULE-SET,manhuagui,漫画柜
  - RULE-SET,x18comic,禁漫天堂
  - RULE-SET,dmm,DMM
  - RULE-SET,javdb,JavDB
  - RULE-SET,pikpak,PickPak
  - RULE-SET,opencode,OpenCode
  - RULE-SET,proxylite,默认代理
  - RULE-SET,domestic,国内直连

  # Google 商店（配合 DNS 策略，解决 Play 无法更新）
  - DOMAIN-SUFFIX,googleapis.cn,Google
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,Google

  # 通用国际服务分流
  - RULE-SET,ai_domain,AI
  - RULE-SET,youtube_domain,YouTube
  - RULE-SET,google_domain,Google
  - RULE-SET,github_domain,GitHub
  - RULE-SET,onedrive_domain,OneDrive
  - RULE-SET,microsoftcn_domain,国内直连
  - RULE-SET,microsoft_domain,Microsoft
  - RULE-SET,applecn_domain,国内直连
  - RULE-SET,apple_domain,Apple
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,tiktok_domain,TikTok
  - RULE-SET,netflix_domain,NETFLIX
  - RULE-SET,paypal_domain,PayPal
  - RULE-SET,binance_domain,Wallet
  - RULE-SET,okx_domain,Wallet
  - RULE-SET,usd_domain,Wallet
  - RULE-SET,steamcn_domain,国内直连
  - RULE-SET,steam_domain,Steam

  # 非大陆域名走代理，大陆 IP 直连
  - RULE-SET,cn!_domain,默认代理
  - RULE-SET,google_ip,Google
  - RULE-SET,apple_ip,Apple
  - RULE-SET,telegram_ip,Telegram
  - RULE-SET,netflix_ip,NETFLIX
  - RULE-SET,cn_ip,国内直连
  - MATCH,默认代理

rule-providers:
  # ===== 自建规则集（classical 文本列表，来自本仓库 rule-providers/）=====
  proxylite: {<<: *class, url: "https://raw.githubusercontent.com/syaofox/jichang/main/rule-providers/proxy.list"}
  domestic: {<<: *class, url: "https://raw.githubusercontent.com/syaofox/jichang/main/rule-providers/domestic.list"}
  manhuagui: {<<: *class, url: "https://raw.githubusercontent.com/syaofox/jichang/main/rule-providers/manhuagui.list"}
  x18comic: {<<: *class, url: "https://raw.githubusercontent.com/syaofox/jichang/main/rule-providers/18comic.list"}
  dmm: {<<: *class, url: "https://raw.githubusercontent.com/syaofox/jichang/main/rule-providers/dmm.list"}
  javdb: {<<: *class, url: "https://raw.githubusercontent.com/syaofox/jichang/main/rule-providers/javdb.list"}
  pikpak: {<<: *class, url: "https://raw.githubusercontent.com/syaofox/jichang/main/rule-providers/pikpak.list"}
  opencode: {<<: *class, url: "https://raw.githubusercontent.com/syaofox/jichang/main/rule-providers/opencode.list"}

  # ===== 通用规则集（MetaCubeX mrs / 域名文本列表）=====
  fakeipfilter_cn: {<<: *domain_text, url: "https://raw.githubusercontent.com/syaofox/jichang/main/rule-providers/fakeipfilter-cn.list"}
  fakeipfilter_!cn: {<<: *domain_text, url: "https://raw.githubusercontent.com/syaofox/jichang/main/rule-providers/fakeipfilter-!cn.list"}
  private_domain: {<<: *domain, url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/private.mrs"}
  ai_domain: {<<: *domain, url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/category-ai-!cn.mrs"}
  youtube_domain: {<<: *domain, url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/youtube.mrs"}
  google_domain: {<<: *domain, url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/google.mrs"}
  github_domain: {<<: *domain, url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/github.mrs"}
  onedrive_domain: {<<: *domain, url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/onedrive.mrs"}
  microsoftcn_domain: {<<: *domain, url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/microsoft@cn.mrs"}
  microsoft_domain: {<<: *domain, url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/microsoft.mrs"}
  applecn_domain: {<<: *domain, url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/apple@cn.mrs"}
  apple_domain: {<<: *domain, url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/apple.mrs"}
  telegram_domain: {<<: *domain, url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/telegram.mrs"}
  tiktok_domain: {<<: *domain, url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/tiktok.mrs"}
  netflix_domain: {<<: *domain, url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/netflix.mrs"}
  paypal_domain: {<<: *domain, url: "https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/paypal.mrs"}
